<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>到府打掃預約系統</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-sub: #7b7b7b;
            --accent: #78866b; /* 文青低飽和抹茶綠 */
            --accent-hover: #637056;
            --border-color: #e6e4df;
            --disabled-bg: #f0eee9;
            --disabled-text: #b5b3ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 人員切換 Tabs */
        .staff-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-sub);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* 預約列表區塊 */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .date-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            background: #fff;
        }

        .date-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .slots-container {
            display: flex;
            gap: 15px;
        }

        .slot-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--accent);
            background: #fff;
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .slot-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
        }

        .slot-btn:disabled {
            background: var(--disabled-bg);
            border-color: var(--border-color);
            color: var(--disabled-text);
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* 彈出表單 Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel {
            flex: 1;
            background: #fff;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-submit:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="container">
        <h1>到府打掃預約服務</h1>
        <p class="subtitle">請選擇您希望預約的人員與時段（可預約未來 2 個月）</p>

        <!-- 人員切換 -->
        <div class="staff-tabs" id="staffTabs">
            <button class="tab-btn active" onclick="switchStaff('1號')">1號</button>
            <button class="tab-btn active" onclick="switchStaff('2號')">2號</button>
            <button class="tab-btn active" onclick="switchStaff('3號')">3號</button>
        </div>

        <!-- 預約列表 -->
        <div class="schedule-list" id="scheduleList">
            <!-- 動態生成 -->
        </div>
    </div>

    <!-- 填寫資料 Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3>填寫預約資料</h3>
            <p id="modalInfo" style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;"></p>
            
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="clientName" placeholder="請輸入您的姓名">
            </div>
            <div class="form-group">
                <label>電話</label>
                <input type="tel" id="clientPhone" placeholder="請輸入您的聯絡電話">
            </div>
            <div class="form-group">
                <label>到府地址</label>
                <input type="text" id="clientAddress" placeholder="請輸入打掃地址">
            </div>
            <div class="form-group">
                <label>備註說明 (選填)</label>
                <textarea id="clientRemark" rows="3" placeholder="例如：有養寵物、大門密碼、重點清掃區域等"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-submit" onclick="confirmBooking()">確認預約</button>
            </div>
        </div>
    </div>

    <script>
        let currentStaff = '1號';
        let selectedDate = '';
        let selectedTime = '';

        // 從 localStorage 讀取預約資料，若無則為空物件
        let bookings = JSON.parse(localStorage.getItem('cleaning_bookings')) || {};

        // 初始化人員 Tab 狀態
        function switchStaff(staff) {
            currentStaff = staff;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.innerText === staff) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderSchedule();
        }

        // 產生未來 60 天（2個月）的日期清單
        function generateDates() {
            let dates = [];
            let today = new Date();
            for (let i = 0; i < 60; i++) {
                let d = new Date(today);
                d.setDate(today.getDate() + i);
                let year = d.getFullYear();
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                let weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                let weekStr = weekDays[d.getDay()];
                dates.push({
                    dateStr: `${year}-${month}-${day}`,
                    displayStr: `${year}/${month}/${day} (${weekStr})`
                });
            }
            return dates;
        }

        // 渲染畫面時段
        function renderSchedule() {
            const listContainer = document.getElementById('scheduleList');
            listContainer.innerHTML = '';
            const dates = generateDates();

            dates.forEach(item => {
                let card = document.createElement('div');
                card.className = 'date-card';

                let title = document.createElement('div');
                title.className = 'date-title';
                title.innerText = item.displayStr;
                card.appendChild(title);

                let slotsContainer = document.createElement('div');
                slotsContainer.className = 'slots-container';

                ['08:00', '13:30'].forEach(time => {
                    let btn = document.createElement('button');
                    btn.className = 'slot-btn';
                    
                    // 檢查是否已被預約：格式為 bookings[staff_date_time]
                    let key = `${currentStaff}_${item.dateStr}_${time}`;
                    if (bookings[key]) {
                        btn.disabled = true;
                        btn.innerText = `${time} (已預約)`;
                    } else {
                        btn.innerText = `${time} 可預約`;
                        btn.onclick = () => openModal(item.dateStr, time);
                    }
                    slotsContainer.appendChild(btn);
                });

                card.appendChild(slotsContainer);
                listContainer.appendChild(card);
            });
        }

        // 打開填寫表單 Modal
        function openModal(date, time) {
            selectedDate = date;
            selectedTime = time;
            document.getElementById('modalInfo').innerText = `已選擇：【${currentStaff}】 ${date} ${time}`;
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientAddress').value = '';
            document.getElementById('clientRemark').value = '';
            document.getElementById('bookingModal').classList.add('active');
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('bookingModal').classList.remove('active');
        }

        // 確認送出預約
        function confirmBooking() {
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            let address = document.getElementById('clientAddress').value.trim();
            let remark = document.getElementById('clientRemark').value.trim();

            if (!name || !phone || !address) {
                alert('請完整填寫姓名、電話與到府地址！');
                return;
            }

            let key = `${currentStaff}_${selectedDate}_${selectedTime}`;
            bookings[key] = {
                name,
                phone,
                address,
                remark,
                timestamp: new Date().toLocaleString()
            };

            // 存入 localStorage
            localStorage.setItem('cleaning_bookings', JSON.stringify(bookings));

            alert('預約成功！');
            closeModal();
            renderSchedule();
        }

        // 初始化執行
        switchStaff('1號');
    </script>
</body>
</html>
